syntax = "proto3";

message ControlSsdp {
    bool enable = 1;
}

message ControlCameraCapture {
    bool enable = 1;
    bool use_heartbeat = 2;
}

message ControlCameraRegisterRead {
    string register_name = 1;
}

message ControlCameraRegisterWrite {
    string register_name = 1;
    uint32 register_value = 2;
}

message ControlMessage {
    oneof request {
        ControlSsdp ssdp = 1;
        ControlCameraCapture camera_capture = 2;
        ControlCameraRegisterRead camera_register_read = 3;
        ControlCameraRegisterWrite camera_register_write = 4;
    }
}

message ControlResponseSsdp {
}

message ControlResponseCameraCapture {
}

message ControlResponseCameraRegisterRead {
    uint32 register_value = 1;
}

message ControlResponseCameraRegisterWrite {
}

message ControlResponseError {
    string reason = 1;
}

enum ControlResponseStatus {
    UNSPECIFIED = 0;
    SUCCESS = 1;
    UKNOWN_REQUEST = 2;
    INVALID_REQUEST = 3;
    INTERNAL_ERROR = 4;
}

message ControlResponseMessage {
    ControlResponseStatus status = 1;
    oneof response {
        ControlResponseSsdp ssdp = 2;
        ControlResponseCameraCapture camera_capture = 3;
        ControlResponseCameraRegisterRead camera_register_read = 4;
        ControlResponseCameraRegisterWrite camera_register_write = 5;
        ControlResponseError error = 6;
    }
}
